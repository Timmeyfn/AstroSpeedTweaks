:root{
  --bg:#F1EEE7;
  --bg-2:#E8E4DA;
  --card:#FAF8F4;
  --card-2:#FFFFFF;
  --ink:#141518;
  --ink-2:#4B4F56;
  --ink-3:#8A8E95;
  --line:rgba(20,21,24,.085);
  --line-2:rgba(20,21,24,.16);
  --accent:#E2542A;
  --accent-soft:rgba(226,84,42,.12);
  --ok:#2E8A57;
  --warn:#B3741A;
  --bad:#C43D49;
  --info:#2F64C4;
  --hero-fade:rgba(241,238,231,.94);
  --contour:rgba(20,21,24,.075);
  --glider-a:#141518; --glider-b:#3D4048; --glider-c:#6B6F78;
  --shadow-s:0 1px 2px rgba(20,21,24,.05),0 0 0 1px var(--line);
  --shadow-m:0 1px 2px rgba(20,21,24,.04),0 10px 30px -12px rgba(20,21,24,.16),0 0 0 1px var(--line);
  --shadow-l:0 2px 6px rgba(20,21,24,.05),0 30px 80px -24px rgba(20,21,24,.28),0 0 0 1px var(--line);

  --inout:cubic-bezier(.76,0,.24,1);
  --soft:cubic-bezier(.22,.61,.36,1);

}
:root[data-theme="dark"]{
  --bg:#0F0F10;

  --accent-soft:rgba(255,107,63,.14);
  --ok:#5CCB8C;
  --warn:#E8B04E;
  --bad:#FF6E7C;
  --info:#7FA8FF;
  --hero-fade:rgba(15,15,16,.9);
  --contour:rgba(255,255,255,.07);
  --glider-a:#FFFFFF; --glider-b:#CFD3DC; --glider-c:#9AA0AD;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:"Manrope",system-ui,sans-serif;font-size:15px;line-height:1.55;font-weight:500;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;user-select:none;transition:background-color .5s var(--soft),color .5s var(--soft)}
button,input{font:inherit;color:inherit}
b,strong{font-weight:700}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ───────────── word-by-word reveal ───────────── */
.kw{display:inline-block;perspective:800px;vertical-align:top}
.kw>span{display:inline-block;transform-origin:50% 100%;will-change:transform}
.title-block.swap .kw>span,#splash .kw>span,.hero.play .kinetic-h .kw>span{animation:kin 1s var(--out) both;animation-delay:calc(var(--k,0) * 60ms + var(--kd,0ms))}
.hero .kinetic-h .kw>span{opacity:0}
.hero.play .kinetic-h{--kd:220ms}
#splash .kw>span{--kd:250ms}
@keyframes kin{from{opacity:0;transform:translateY(70%) rotateX(-60deg)}to{opacity:1;transform:none}}

/* ───────────── splash: a curtain that lifts ───────────── */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:transform 1.1s var(--inout),border-radius 1.1s var(--inout)}
#splash.out{transform:translateY(-102%);border-radius:0 0 50% 50%/0 0 60px 60px}
.splash-core{display:grid;justify-items:center;gap:20px;transition:transform 1.1s var(--inout),opacity .6s ease}
#splash.out .splash-core{transform:translateY(-60px);opacity:0}
.splash-mark{width:76px;height:76px;border-radius:20px;opacity:0;transform:translateY(12px) scale(.9);animation:markIn 1s var(--out) .05s forwards;box-shadow:var(--shadow-m)}
.splash-word{font-weight:800;font-size:38px;letter-spacing:-.045em;line-height:1}
.splash-line{width:180px;height:2px;border-radius:2px;background:var(--line);overflow:hidden}
.splash-line i{display:block;height:100%;transform:scaleX(0);transform-origin:left;background:var(--ink);animation:lineIn 1.4s var(--inout) .5s forwards}
@keyframes markIn{to{opacity:1;transform:none}}
@keyframes lineIn{to{transform:scaleX(1)}}

/* ───────────── shell ───────────── */
#app{display:grid;grid-template-columns:var(--rail) 1fr;height:100vh}
#app .rail,#app .topbar{opacity:0}
#app.ready .rail{animation:railIn 1.1s var(--out) .25s both}
#app.ready .topbar{animation:topIn 1.1s var(--out) .35s both}
@keyframes railIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes topIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

.rail{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:background-color .5s var(--soft)}
.brand{display:flex;align-items:center;gap:12px;padding:26px 24px 22px}
.brand-mark{width:38px;height:38px;border-radius:11px;box-shadow:var(--shadow-s)}
.wordmark{font-weight:800;font-size:17px;letter-spacing:-.035em;line-height:1.1;white-space:nowrap}
.brand-text{min-width:0}
.brand-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{color:var(--ink-3);font-size:12.5px;margin-top:2px}
#navWrap{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 14px 14px;position:relative}
#nav{position:relative;z-index:1}
#navInd{position:absolute;left:14px;right:14px;top:0;height:38px;border-radius:12px;background:var(--card-2);box-shadow:var(--shadow-s);transition:transform .6s var(--out),height .6s var(--out),opacity .3s;opacity:0;z-index:0;pointer-events:none}
:root[data-theme="dark"] #navInd{background:var(--card-2)}
.nav-group{margin-top:18px}
.nav-group:first-child{margin-top:2px}
.nav-label{color:var(--ink-3);font-size:11.5px;font-weight:700;padding:0 12px 7px;letter-spacing:.12em;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;height:38px;border:0;background:none;padding:0 12px;border-radius:12px;color:var(--ink-2);cursor:pointer;text-align:left;font-size:14.5px;font-weight:600;letter-spacing:-.01em;transition:color .25s}
.nav-item svg{font-size:17px;transition:transform .5s var(--out)}
.nav-item:hover{color:var(--ink)}
.nav-item:hover svg{transform:translateX(2px)}
.nav-item.active{color:var(--ink)}
.nav-item.active svg{color:var(--accent)}
.nav-item .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .count{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:600;white-space:nowrap;flex:none}
.nav-item .count b{color:var(--ink-2)}
.nav-item.full .count,.nav-item.full .count b{color:var(--ok)}
.rail-foot{border-top:1px solid var(--line);padding:16px 24px 20px;display:grid;gap:9px}
.foot-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.foot-row.dim{color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none;position:relative}
.dot.on{background:var(--ok)}
.dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);opacity:0;animation:ping 2.8s var(--soft) infinite}
.dot.warn{background:var(--warn)}
.dot.off{background:var(--bad)}
@keyframes ping{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(1.9);opacity:0}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:30px 44px 22px;position:relative;z-index:3}
.scroll-bar{position:absolute;left:44px;right:44px;bottom:0;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;opacity:.85}
.title-block{min-width:0}
h1{font-weight:800;font-size:36px;letter-spacing:-.045em;line-height:1.05;margin:0}
#pageSub{margin:9px 0 0;color:var(--ink-2);max-width:78ch;font-size:15px}
.title-block.swap #pageSub{animation:subIn .9s var(--out) .18s both}
@keyframes subIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top-actions{display:flex;align-items:center;gap:10px;flex:none}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-s);display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:color .2s,transform .5s var(--out),background-color .3s}
.icon-btn svg{font-size:17px}
.icon-btn:hover{color:var(--ink);transform:rotate(-12deg)}
.search{display:flex;align-items:center;gap:9px;height:42px;padding:0 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-s);width:280px;color:var(--ink-3);transition:box-shadow .3s,width .6s var(--out),background-color .3s}
.search:focus-within{width:330px;color:var(--ink);box-shadow:0 0 0 1px var(--line-2),0 0 0 5px var(--accent-soft)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;font-weight:500}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{display:none}
kbd{font-family:inherit;font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:0 6px;font-weight:600}

/* ───────────── buttons ───────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:42px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:700;font-size:14.5px;letter-spacing:-.01em;white-space:nowrap;position:relative;transition:transform .5s var(--out),box-shadow .4s var(--out),background-color .3s,color .3s}
.btn svg{font-size:17px}
.btn .arr{transition:transform .5s var(--out);margin-left:-2px}
.btn:hover .arr{transform:translateX(4px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 22px -10px rgba(20,21,24,.5)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.12),0 16px 32px -12px rgba(20,21,24,.55)}
:root[data-theme="dark"] .btn.primary{box-shadow:0 8px 24px -10px rgba(255,255,255,.25)}
.btn.secondary,.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow-s)}
.btn.secondary:hover,.btn.ghost:hover{transform:translateY(-2px);box-shadow:var(--shadow-m)}
.btn.quiet{background:none;color:var(--ink-2);padding:0 10px}
.btn.quiet:hover{color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger:hover{transform:translateY(-2px)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.btn.lg{height:52px;padding:0 24px;font-size:15.5px}
.btn[disabled]{opacity:.38;cursor:default;transform:none!important;box-shadow:none}

/* ───────────── banners ───────────── */
#banners:empty{display:none}
#banners{padding:0 44px;display:grid;gap:8px;position:relative;z-index:2;margin-bottom:6px}
.banner{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;font-size:14px;border-radius:16px;background:var(--card);box-shadow:var(--shadow-s);animation:bannerIn .7s var(--out)}
.banner>svg{font-size:18px}
.banner.reboot>svg{color:var(--accent)}
.banner.warn>svg{color:var(--bad)}
.banner.crash>svg{color:var(--warn)}
.banner.news>svg{color:var(--accent)}
.from-pack{display:inline-flex;align-items:center;gap:5px;color:var(--accent)}
.from-pack svg{width:13px;height:13px}
.pack-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.pack-stats>div{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.pack-stats b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pack-stats span{font-size:12px;color:var(--ink-3)}
.pack-probs{margin:0 0 12px;font-size:12.5px;color:var(--ink-3)}
.pack-probs summary{cursor:pointer;color:var(--warn);font-weight:600;margin-bottom:6px}
.pack-probs div{padding:3px 0;border-top:1px solid var(--line)}
.banner .btn{margin-left:auto}
@keyframes bannerIn{from{opacity:0;transform:translateY(-8px)}}

/* ───────────── view ───────────── */
.view{flex:1;overflow-y:auto;padding:10px 44px 70px;outline:none;position:relative;z-index:1;perspective:1600px}
.rv{opacity:0;transform:translateY(60px) rotateX(9deg) rotateY(var(--ry,5deg));transform-origin:50% 0}
.rv-r{--ry:-5deg}
.rv.in{opacity:1;transform:none;transition:transform 1.15s var(--out) var(--rd,0ms),opacity .8s var(--soft) var(--rd,0ms)}

.panel{position:relative;background:var(--card);border-radius:22px;box-shadow:var(--shadow-s);overflow:hidden;transition:background-color .5s var(--soft),box-shadow .5s var(--out)}
.panel.rv.in{transition:transform 1.15s var(--out) var(--rd,0ms),opacity .8s var(--soft) var(--rd,0ms),box-shadow .5s var(--out),background-color .5s}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 42%)}
.spot:hover::before{opacity:.55}
.spot:hover{box-shadow:var(--shadow-m)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 26px 4px;position:relative}
.panel-h h2,.h2{font-weight:800;font-size:17px;margin:0;letter-spacing:-.03em}
.panel-b{padding:12px 26px 24px;position:relative}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:13px}
.grid{display:grid;gap:20px}

/* ───────────── dashboard hero ───────────── */
.hero{position:relative;height:clamp(500px,57vh,620px);border-radius:30px;overflow:hidden;isolation:isolate;background:var(--bg-2);box-shadow:var(--shadow-s)}
.hero-land{position:absolute;inset:-24px;will-change:transform}
.land{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 72%;transition:opacity 1s var(--soft)}
.land.night{opacity:0}
:root[data-theme="dark"] .land.night{opacity:1}
:root[data-theme="dark"] .land.day{opacity:0}
.hero.play .hero-land .land{animation:landIn 3.4s var(--out) both}
@keyframes landIn{from{transform:scale(1.16) translateY(14px);filter:blur(8px)}to{transform:none;filter:none}}
.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,var(--hero-fade) 0%,var(--hero-fade) 22%,transparent 64%)}
.contours{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);z-index:1;pointer-events:none;opacity:0}
.contours path{fill:none;stroke:var(--contour);stroke-width:1}
.hero.play .contours{animation:fadeIn 2.4s var(--soft) .6s forwards}
@keyframes fadeIn{to{opacity:1}}
.flightpath{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;opacity:0}
.hero.play .flightpath{animation:fadeIn 1.2s var(--soft) .4s forwards}
.flightpath .route{fill:none;stroke:var(--ink);stroke-opacity:.22;stroke-width:1.5;stroke-dasharray:2 9;stroke-linecap:round}
.flightpath .done{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round}
.flightpath .goal{fill:var(--card-2);stroke:var(--ink);stroke-opacity:.5;stroke-width:1.5}
.glider{position:absolute;left:0;top:0;width:84px;height:28px;margin:-14px 0 0 -70px;transform-origin:70px 14px;z-index:3;pointer-events:none;will-change:transform;opacity:0}
.hero.play .glider{animation:fadeIn .8s var(--soft) .5s forwards}
.glider .bob{width:100%;height:100%;animation:bob 4.6s ease-in-out infinite}
.glider svg{width:84px;height:28px;stroke:none;filter:drop-shadow(0 4px 10px rgba(226,84,42,.35))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.depth{position:absolute;right:6%;top:10%;width:40%;height:64%;z-index:2;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.tile{position:absolute;opacity:0}
.tile.t0{left:2%;top:14%}
.tile.t1{left:44%;top:0}
.tile.t2{left:12%;top:62%}
.tile.t3{right:0;top:44%}
.hero.play .tile{animation:tileIn 1.5s var(--out) both}
.hero.play .t0{animation-delay:.55s}.hero.play .t1{animation-delay:.7s}.hero.play .t2{animation-delay:.85s}.hero.play .t3{animation-delay:1s}
@keyframes tileIn{from{opacity:0;transform:translate3d(0,50px,-120px) rotateX(35deg) rotateY(-25deg)}to{opacity:1;transform:none}}
.tile-in{display:grid;justify-items:start;gap:2px;min-width:112px;padding:14px 16px 13px;border-radius:18px;background:color-mix(in srgb,var(--card-2) 72%,transparent);backdrop-filter:blur(16px) saturate(1.3);box-shadow:var(--shadow-m);animation:float 7s ease-in-out infinite}
.t1 .tile-in{animation-delay:-2s;animation-duration:8s}
.t2 .tile-in{animation-delay:-4s;animation-duration:6.5s}
.t3 .tile-in{animation-delay:-1s;animation-duration:7.5s}
.tile-in svg{font-size:18px;color:var(--accent);margin-bottom:6px}
.tile-in b{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1}
.tile-in small{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
@keyframes float{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-14px,0) rotate(.8deg)}}

.hero-copy{position:relative;z-index:4;padding:52px 56px 0;max-width:720px}
.chip{display:inline-flex;align-items:center;gap:9px;margin:0 0 22px;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 14px 6px 11px;border-radius:999px;background:color-mix(in srgb,var(--card-2) 70%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow-s)}
.chip .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}
.kinetic-h{font-weight:800;font-size:clamp(52px,4.6vw,76px);line-height:.98;letter-spacing:-.055em;margin:0}
.kinetic-h .pct{display:inline-block;text-align:right}
.lede{margin:22px 0 0;color:var(--ink-2);font-size:16.5px;line-height:1.55;max-width:48ch}
.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.compat{margin:22px 0 0;color:var(--ink-3);font-size:13px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 0}
.compat b{color:var(--ink);font-weight:700;margin-right:5px}
.compat i{width:3px;height:3px;border-radius:50%;background:var(--ink-3);margin:0 12px;opacity:.7}
.hero .hero-step{opacity:0}
.hero.play .hero-step{animation:stepIn 1.1s var(--out) both;animation-delay:calc(var(--s,0) * 90ms + 160ms)}
.hero.still *:not(.tile-in):not(.bob){animation-duration:0s!important;animation-delay:0s!important}
@keyframes stepIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.ribbon{margin:18px -44px 0;overflow:hidden;border-block:1px solid var(--line);padding:15px 0;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ribbon-track{display:flex;align-items:center;gap:30px;width:max-content;animation:marquee 46s linear infinite}
.ribbon:hover .ribbon-track{animation-play-state:paused}
.ribbon span{font-size:13px;font-weight:800;letter-spacing:.18em;color:var(--ink-2)}
.ribbon i{display:grid;place-items:center;color:var(--accent)}
.ribbon i svg{font-size:13px;stroke-width:2}
@keyframes marquee{to{transform:translateX(-50%)}}

.dash-grid{display:grid;grid-template-columns:1.05fr 1.25fr 1fr;gap:20px;margin-top:26px;align-items:start}
.spec{display:grid;grid-template-columns:auto 1fr;gap:12px 18px;font-size:14px;margin:0}
.spec dt{color:var(--ink-3);font-weight:600}
.spec dd{margin:0;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.spec dd .note{display:block;font-size:12.5px;white-space:normal;font-weight:500}
.checks{display:grid}
.check{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.check:first-child{border-top:0}
.check .t{line-height:1.3}
.check .t small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px;font-weight:500}
.ico-ok{color:var(--ok)}.ico-warn{color:var(--warn)}.ico-bad{color:var(--bad)}.ico-na{color:var(--ink-3)}
.check svg{font-size:20px}
.protect ul{margin:0;padding:0;display:grid;gap:11px}
.protect li{display:flex;gap:11px;align-items:flex-start;list-style:none;font-size:14px;font-weight:600}
.protect li svg{color:var(--ink-3);font-size:16px;margin-top:2px}

/* ───────────── live monitor & your games ───────────── */
.dash-row{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-top:26px;align-items:stretch}
.dash-row+.dash-grid{margin-top:20px}
.live-dot{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.live-dot i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:blink 2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.live-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.lv{display:grid;align-content:start;gap:4px;padding:6px 20px 4px;border-left:1px solid var(--line);min-width:0}
.lv:first-child{border-left:0;padding-left:0}
.lv-l{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.lv-v{font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-v small{font-size:16px;color:var(--ink-3);margin-left:2px;letter-spacing:0}
.lv-game{font-size:22px;letter-spacing:-.035em;padding-top:8px}
.lv-s{font-size:12.5px;color:var(--ink-3);font-weight:600}
.spark{width:100%;height:34px;margin-top:6px;overflow:visible}
.spark .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .area{fill:var(--accent-soft);opacity:.55;stroke:none}
.ygames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.yg{display:grid;justify-items:center;gap:6px;padding:12px 6px 10px;border:0;border-radius:16px;background:none;cursor:pointer;text-align:center;transition:background-color .3s,transform .5s var(--out)}
.yg:hover{background:var(--bg);transform:translateY(-3px)}
.yg span{font-size:13px;font-weight:700;letter-spacing:-.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yg small{font-size:11.5px;color:var(--ink-3);font-weight:600}

/* ───────────── games ───────────── */
.gicon{width:var(--s);height:var(--s);border-radius:calc(var(--s) * .26);display:grid;place-items:center;flex:none;overflow:hidden;background:var(--bg);box-shadow:var(--shadow-s);transition:transform .6s var(--out)}
.gicon img{width:78%;height:78%;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}
.gicon.mono{background:linear-gradient(145deg,color-mix(in srgb,var(--gc) 92%,#fff),color-mix(in srgb,var(--gc) 70%,#000));color:#fff;font-weight:800;font-size:calc(var(--s) * .34);letter-spacing:-.04em;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),var(--shadow-s)}
.games-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.gcard{border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:0 22px;font:inherit;color:inherit}
.gbanner{display:block;position:relative;margin:0 -22px 16px;aspect-ratio:2/1;overflow:hidden;background:var(--bg-2)}
.gbanner .art{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;transition:transform 1.1s var(--out)}
.gbanner::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -1px 0 var(--line);pointer-events:none}
.gbanner.plain{display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--gc) 88%,#fff),color-mix(in srgb,var(--gc) 62%,#000))}
.gbanner.plain b{color:#fff;font-size:44px;font-weight:800;letter-spacing:-.05em;opacity:.95}
.gbanner.plain .ico{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));transition:transform 1.1s var(--out)}
.gcard:hover .gbanner .art,.gcard:hover .gbanner .ico{transform:scale(1.06)}
.gicon.art{background:#000}
.gicon{position:relative}
.gicon .steam{position:absolute;inset:0;width:100%;height:100%;filter:none}
.gbanner.plain .steam{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.1s var(--out)}
.gcard:hover .gbanner .steam{transform:scale(1.06)}
.gicon.art .art{width:100%;height:100%;box-sizing:border-box;filter:none}
.game-head .gbanner{margin:0;aspect-ratio:3.2/1}
.game-head .panel-b{padding-top:20px}
.gcard .gname{font-weight:800;font-size:17px;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gstudio,.gstudio{font-size:13px;color:var(--ink-3);font-weight:600}
.gcard .gfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.gcard .gcount{font-size:13px;color:var(--ink-3);font-weight:600}
.gcard .gcount b{color:var(--ink)}
.gcard .gbar{height:3px;margin:18px -22px 0;background:var(--line)}
.gcard .gbar i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:width .8s var(--out)}
.gcard:hover{transform:translateY(-4px)}
.gcard.rv.in:hover{transform:translateY(-4px);transition:transform .6s var(--out),box-shadow .5s var(--out)}
.gcard.missing{opacity:.62}
.gcard.missing:hover{opacity:1}
.pill svg{font-size:13px}
.game-head .gh-top{display:flex;align-items:center;gap:20px}
.game-head .gh-name{font-weight:800;font-size:28px;letter-spacing:-.045em;line-height:1.1}
.path{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--ink-2)}
.note-line{display:flex;gap:9px;align-items:flex-start;margin:14px 0 0;font-size:13.5px;color:var(--warn);font-weight:600}
.note-line svg{font-size:16px;margin-top:2px}
.ab-row{display:flex;align-items:center;gap:18px;padding-top:20px}
.ab-t{font-weight:800;font-size:16px;letter-spacing:-.025em;margin-bottom:2px}


/* ───────────── settings, updates, storage ───────────── */
.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0;padding-top:4px}
.panel-b>p+.set-row{border-top:1px solid var(--line);margin-top:14px}
.set-t{display:grid;gap:3px;min-width:0}
.set-t b{font-size:15px;letter-spacing:-.015em}
.set-t span{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;color:var(--ink)}
.upd-pill{display:flex;align-items:center;gap:9px;border:0;cursor:pointer;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:999px;text-align:left;animation:bannerIn .7s var(--out)}
.upd-pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent);animation:blink 1.6s ease-in-out infinite}
.upd-mark{width:48px;height:48px;border-radius:14px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.upd-mark svg{font-size:22px;transform:rotate(-90deg)}
.btn .down{transform:rotate(90deg)}
.upd-notes{padding:16px 18px;border-radius:16px;background:var(--bg);font-size:14px;color:var(--ink-2);max-height:34vh;overflow:auto;user-select:text}
.upd-notes h3,.upd-notes h4{margin:0 0 8px;color:var(--ink);font-size:15px;letter-spacing:-.02em}
.upd-notes p{margin:0 0 8px}
.upd-notes ul.notes{margin:0 0 8px;padding-left:18px;display:grid;gap:4px}
.storage{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:12px}
.st-h{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.drive .dr-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px;margin-bottom:6px}
.drive .dr-top span{color:var(--ink-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drive .dr-top em{margin-left:auto;font-style:normal;color:var(--ink-2);font-weight:600;white-space:nowrap}
.drive.low .meterbar i{background:var(--bad)}
.drive.low .dr-top em{color:var(--bad)}

/* ───────────── tweak lists ───────────── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.seg{display:inline-flex;border-radius:999px;padding:4px;background:var(--bg-2)}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;color:var(--ink-2);cursor:pointer;font-size:13.5px;font-weight:700;transition:color .2s,background-color .3s,box-shadow .3s}
.seg button.on{color:var(--ink);background:var(--card-2);box-shadow:var(--shadow-s)}
.toolbar .spacer{flex:1}
.sum{color:var(--ink-2);font-size:13.5px}
.sum b{color:var(--ink)}

.group{margin-bottom:32px}
.group-h{display:flex;align-items:baseline;gap:12px;margin:0 0 12px 4px}
.group-h h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.025em}
.group-h span{color:var(--ink-3);font-size:13px;font-weight:600}
.rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-s)}
.rows.single{grid-template-columns:1fr}
.row{background:var(--card);padding:18px 20px 17px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:start;align-content:start;position:relative;transition:background-color .35s var(--soft)}
.rows>.row:last-child:nth-child(odd){grid-column:1/-1}
.row:hover{background:var(--card-2)}
.row.na{opacity:.5}
.row.flash::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent-soft),transparent);animation:sweep 1.1s var(--out) forwards}
.row.flash.off::after{background:linear-gradient(90deg,transparent,var(--line),transparent)}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.row .title{font-weight:700;font-size:15px;line-height:1.35;padding-top:2px;letter-spacing:-.015em}
.row .desc{grid-column:2/4;color:var(--ink-2);font-size:13.5px;line-height:1.55;max-width:76ch}
.row .benefit{grid-column:2/4;font-size:13.5px;color:var(--ink);display:flex;gap:8px;align-items:flex-start;margin-top:4px;font-weight:600}
.row .benefit svg{color:var(--accent);font-size:15px;margin-top:3px}
.row .note{grid-column:2/4;font-size:13px;color:var(--warn);display:flex;gap:8px;align-items:flex-start;margin-top:2px;font-weight:600}
.row .note svg{font-size:15px;margin-top:2px}
.row .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:9px;font-size:12.5px;color:var(--ink-3);font-weight:600}
.row .meta .risk-moderate{color:var(--warn)}
.row .meta .risk-expert{color:var(--bad)}
.row .meta .state-native{color:var(--info)}
.row .meta .state-reset{color:var(--warn)}
.row .meta .state-na{color:var(--ink-2)}
.row .meta button{background:none;border:0;color:var(--ink-2);cursor:pointer;padding:0;font-size:12.5px;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.row .meta button:hover{color:var(--ink)}
.impact{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:3px;vertical-align:-1px}
.impact i{width:4px;border-radius:1px;background:var(--line-2)}
.impact i:nth-child(1){height:5px}.impact i:nth-child(2){height:8px}.impact i:nth-child(3){height:12px}
.impact.l1 i:nth-child(-n+1),.impact.l2 i:nth-child(-n+2),.impact.l3 i:nth-child(-n+3){background:var(--ink)}
.changes{grid-column:2/4;margin:10px 0 0;padding:11px 13px;border-radius:12px;background:var(--bg);font-size:12.5px;color:var(--ink-2);display:grid;gap:4px;word-break:break-all;user-select:text;animation:open .5s var(--out)}
@keyframes open{from{opacity:0;transform:translateY(-6px)}}

.switch{position:relative;width:46px;height:26px;border-radius:999px;border:0;padding:0;background:var(--line-2);cursor:pointer;flex:none;margin-top:1px;transition:background-color .4s var(--soft)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card-2);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .55s var(--out),width .3s var(--out)}
.switch:active::after{width:24px}
.switch[aria-checked="true"]{background:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--bg)}
.switch[aria-checked="true"]:active::after{transform:translateX(16px)}
.switch.native[aria-checked="true"]{background:var(--ink-3)}
.switch.busy::after{animation:pulse .7s ease-in-out infinite alternate}
.switch[disabled]{cursor:default;opacity:.5}
@keyframes pulse{to{opacity:.35;transform:translateX(10px)}}
.reboot-ico{color:var(--ink-3);font-size:16px;margin-top:4px}

.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:30px}
.steps{margin:0;padding:0 0 0 22px;display:grid;gap:9px;font-size:14px;color:var(--ink-2)}
.steps li::marker{color:var(--accent);font-weight:800}
.steps b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--ink-2)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* ───────────── tools ───────────── */
.tools-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.tool{padding:26px;display:flex;flex-direction:column;gap:10px;min-height:236px}
.tool h3{margin:0;font-weight:800;font-size:17px;letter-spacing:-.03em}
.tool .big{font-size:36px;font-weight:800;letter-spacing:-.05em;line-height:1.05}
.tool .big small{font-size:14px;color:var(--ink-3);font-weight:600;margin-left:6px;letter-spacing:-.01em}
.tool .grow{flex:1}
.meterbar{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden}
.meterbar i{display:block;height:100%;border-radius:6px;background:var(--ink);transform-origin:left;animation:grow 1.4s var(--out) both}
@keyframes grow{from{transform:scaleX(0)}}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .n{font-weight:700}
.li .d{color:var(--ink-3);font-size:13px}
.li .s{color:var(--ink-2);font-size:13.5px;text-align:right;min-width:90px;font-weight:600}
.cb{appearance:none;width:20px;height:20px;border-radius:7px;border:1.5px solid var(--line-2);background:var(--card-2);display:grid;place-items:center;cursor:pointer;margin:0;transition:background-color .25s,border-color .25s,transform .4s var(--out)}
.cb:checked{background:var(--ink);border-color:var(--ink)}
.cb:checked::after{content:"";width:10px;height:6px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px);animation:tick .35s var(--out)}
@keyframes tick{from{transform:rotate(-45deg) translate(1px,-1px) scale(0)}}
.cmd{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56ch}
table.ping{width:100%;border-collapse:collapse;font-size:14px}
.ping th{text-align:left;color:var(--ink-3);font-weight:700;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ping td{padding:12px 10px;border-bottom:1px solid var(--line);font-weight:600}
.ping td.num,.ping th.num{text-align:right}
.ping tr{animation:stepIn .7s var(--out) both;animation-delay:calc(var(--i,0) * 60ms)}
.bar{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ink);transform-origin:left;animation:grow 1.2s var(--out) both}
.logbox{max-height:520px;overflow:auto;font-size:13px;line-height:1.7;color:var(--ink-2);padding:14px 16px;background:var(--bg);border-radius:14px;white-space:pre-wrap;user-select:text}

/* ───────────── dialogs ───────────── */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 55%,rgba(10,10,12,.45));backdrop-filter:blur(10px);display:grid;place-items:center;z-index:50;padding:40px;opacity:0;transition:opacity .45s var(--soft);perspective:1400px}
.modal.show{opacity:1}
.modal[hidden]{display:none}
.dialog{width:min(1140px,100%);max-height:calc(100vh - 80px);display:flex;flex-direction:column;background:var(--card);border-radius:30px;box-shadow:var(--shadow-l);overflow:hidden;transform:translateY(40px) rotateX(8deg) scale(.97);opacity:0;transition:transform .8s var(--out),opacity .5s var(--soft);transform-origin:50% 100%}
.modal.show .dialog{transform:none;opacity:1}
.dialog.narrow{width:min(560px,100%)}
.dialog-h{padding:32px 36px 8px;display:flex;align-items:flex-start;gap:16px}
.dialog-h h2{font-weight:800;font-size:28px;margin:0;letter-spacing:-.045em;line-height:1.1}
.dialog-h p{margin:8px 0 0;color:var(--ink-2)}
.dialog-h .x{margin-left:auto}
.dialog-b{padding:20px 36px;overflow:auto;flex:1}
.dialog-f{padding:20px 36px 28px;display:flex;gap:12px;align-items:center;border-top:1px solid var(--line)}
.dialog-f .spacer{flex:1}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;perspective:1100px}
.profile{border:0;border-radius:22px;padding:24px 26px;cursor:pointer;background:var(--bg);text-align:left;display:grid;gap:10px;position:relative;box-shadow:0 0 0 1px var(--line);transition:box-shadow .4s var(--out),transform .6s var(--out),background-color .3s}
.modal.show .profile{animation:planIn 1.2s var(--out) both}
.modal.show .profile:nth-child(1){animation-delay:.12s;--rot:-3.5deg}
.modal.show .profile:nth-child(2){animation-delay:.24s;--rot:-1.5deg}
@keyframes planIn{from{opacity:0;transform:translateY(80px) rotate(var(--rot,-3deg)) rotateY(-14deg)}to{opacity:1;transform:none}}
.profile:hover{transform:translateY(-3px)}
.profile.on{background:var(--card-2);box-shadow:0 0 0 2px var(--ink),var(--shadow-m)}
.profile .p-name{font-weight:800;font-size:21px;letter-spacing:-.04em;display:flex;align-items:center;gap:10px}
.profile .p-count{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:700;letter-spacing:0}
.profile ul{margin:2px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px;display:grid;gap:4px}
.optline{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:14.5px;font-weight:600;cursor:pointer}
.flight{display:grid;font-size:14px;max-height:46vh;overflow:auto;border-radius:18px;background:var(--bg)}
.fl{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 18px;border-top:1px solid var(--line);animation:flIn .6s var(--out) both;font-weight:600}
.fl:first-child{border-top:0}
.fl .m{color:var(--ink-3);font-size:13px;text-align:right;font-weight:500}
.fl svg{font-size:18px;animation:pop .5s var(--out)}
@keyframes flIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.progress{height:6px;border-radius:6px;background:var(--bg-2);overflow:hidden;margin:6px 0 20px}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .6s var(--out);border-radius:6px;position:relative;overflow:hidden}
.progress i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:bar 1.6s var(--inout) infinite}
.progress.done i::after{display:none}
@keyframes bar{to{transform:translateX(100%)}}
.result-head{display:flex;align-items:center;gap:24px;margin:4px 0 22px}
.done-ring{width:64px;height:64px;flex:none}
.done-ring circle{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:189;stroke-dashoffset:189;animation:draw 1.1s var(--out) forwards;transform:rotate(-90deg);transform-origin:center}
.done-ring path{fill:none;stroke:var(--ok);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s var(--out) .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.result-stats{display:flex;gap:44px}
.result-stats .v{font-size:34px;font-weight:800;letter-spacing:-.05em;line-height:1.1}
.result-stats .l{color:var(--ink-3);font-size:13px;font-weight:600}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toasts{position:fixed;right:30px;bottom:30px;display:grid;gap:10px;z-index:60;width:min(420px,calc(100vw - 60px))}
.toast{background:var(--ink);color:var(--bg);border-radius:18px;padding:14px 18px 16px;box-shadow:0 20px 50px -16px rgba(0,0,0,.45);font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;animation:tin .8s var(--out);position:relative;overflow:hidden}
.toast.leave{animation:tout .45s var(--inout) forwards}
.toast svg{font-size:18px;margin-top:1px}
.toast.ok svg{color:var(--ok)}.toast.err svg{color:var(--bad)}.toast.info svg{color:var(--accent)}
.toast::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--bg);opacity:.25;transform-origin:left;animation:life var(--life,4.2s) linear forwards}
@keyframes tin{from{transform:translateY(24px) scale(.96);opacity:0}}
@keyframes tout{to{transform:translateY(16px);opacity:0}}
@keyframes life{to{transform:scaleX(0)}}

.empty{padding:70px 20px;text-align:center;color:var(--ink-2)}
.empty h3{font-weight:800;font-size:20px;letter-spacing:-.035em;color:var(--ink);margin:0 0 6px}

@media (max-width:1700px){
  .games-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dash-grid{grid-template-columns:1fr 1fr}
  .dash-grid>:last-child{grid-column:1/-1}
  .tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1500px){
  .settings-grid{grid-template-columns:1fr}
  .dash-row{grid-template-columns:1fr}
  .games-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rows{grid-template-columns:1fr}
  .rows>.row:last-child:nth-child(odd){grid-column:auto}
  .search{width:220px}
  .search:focus-within{width:260px}
  .topbar{padding:26px 30px 18px}
  .scroll-bar{left:30px;right:30px}
  .view{padding:10px 30px 56px}
  #banners{padding:0 30px}
  .ribbon{margin:18px -30px 0}
  .depth{width:46%;right:2%}
  .tile.t2{display:none}
}
@media (max-width:1320px){
  :root{--rail:236px}
  .search{display:none}
  .depth{display:none}
  .profiles{grid-template-columns:1fr}
}

/* motion off (button or Windows setting): everything simply appears */
.motion-off *,.motion-off *::before,.motion-off *::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}
.motion-off .ribbon-track,.motion-off .tile-in,.motion-off .glider .bob{animation:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
  .ribbon-track,.tile-in,.glider .bob{animation:none!important}
}

/* ───────────── PC checkup ───────────── */
.scan-panel,.score-panel{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:40px;padding:34px 40px}
.scan-panel{grid-template-columns:220px 1fr}
.scan-ring,.score-ring{position:relative;width:220px;height:220px}
.scan-ring svg,.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.scan-ring circle,.score-ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.trk{stroke:var(--line)}
.scan-ring .sweep{stroke:var(--accent);transform-origin:100px 100px;animation:spin 1.1s var(--inout) infinite}
.scan-mid,.score-mid{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.scan-mid svg{width:46px;height:46px;transform:none;color:var(--accent)}
.scan-mid svg path{stroke-dasharray:60;stroke-dashoffset:60;animation:beat 1.6s var(--inout) infinite}
@keyframes beat{50%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
.scan-copy h2,.score-copy h2{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:4px 0 8px}
.scan-copy p,.score-copy p{max-width:560px;margin:0;font-size:15px;line-height:1.5}
.scan-steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.scan-steps span{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--bg-2);color:var(--ink-3);animation:stepGlow 2.8s var(--soft) infinite;animation-delay:calc(var(--i) * .2s)}
@keyframes stepGlow{0%,100%{color:var(--ink-3);background:var(--bg-2)}15%{color:var(--accent);background:var(--accent-soft)}}
.score-ring .val{stroke:url(#sg);transition:stroke-dashoffset 1.9s var(--out) .2s;filter:drop-shadow(0 4px 14px var(--accent-soft))}
.score-mid b{font-size:64px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.score-mid span{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:6px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.score-copy .actions{display:flex;gap:10px;margin-top:22px}
.score-legend{display:flex;flex-direction:column;gap:18px;padding-left:36px;border-left:1px solid var(--line)}
.score-legend div{display:flex;flex-direction:column}
.score-legend b{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score-legend span{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-top:4px}
.cu-list{margin-top:18px;background:var(--card);border-radius:22px;box-shadow:var(--shadow-s);overflow:hidden}
.cu-row{display:grid;grid-template-columns:26px 1fr auto auto;align-items:center;gap:16px;padding:16px 26px;border-top:1px solid var(--line);position:relative}
.cu-row:first-child{border-top:0}
.cu-row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--warn);opacity:0}
.cu-row.warn::before{opacity:1}
.cu-ico svg{font-size:22px;display:block}
.cu-row .t b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.cu-row .t small{display:block;font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.cu-w{font-size:11.5px;font-weight:700;white-space:nowrap;color:var(--ink-3)}
.cu-w.w3{color:var(--bad)}.cu-w.w2{color:var(--warn)}
.cu-fix{min-width:0;display:flex;justify-content:flex-end}
.cu-anim .cu-row{animation:cuIn .7s var(--out) both;animation-delay:calc(.5s + var(--i) * 55ms)}
.cu-anim .cu-row .cu-ico{animation:pop .5s var(--out) both;animation-delay:calc(.75s + var(--i) * 55ms)}
.cu-anim .score-copy>*{animation:stepIn .8s var(--out) both}
.cu-anim .score-copy>*:nth-child(2){animation-delay:.08s}.cu-anim .score-copy>*:nth-child(3){animation-delay:.16s}.cu-anim .score-copy>*:nth-child(4){animation-delay:.24s}
.cu-anim .score-ring{animation:ringIn 1s var(--out) both}
@keyframes ringIn{from{opacity:0;transform:scale(.85) rotate(-20deg)}}
@keyframes cuIn{from{opacity:0;transform:translateY(16px);filter:blur(4px)}}

/* ───────────── live ping ───────────── */
.live-ping{margin-top:18px}
.lp-ctl{display:flex;gap:10px;align-items:center}
.lp-ctl select{height:34px;border-radius:999px;border:1px solid var(--line-2);background:var(--card-2);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:0 14px;cursor:pointer}
.lp-stats{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;margin-bottom:14px}
.lp-stats div{border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.lp-stats span{display:block;font-size:12px;color:var(--ink-3);font-weight:600}
.lp-stats b{font-size:22px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lp-stats .big b{color:var(--accent)}
.lp-chart{position:relative;height:200px;border-radius:16px;background:var(--bg-2);overflow:hidden;padding-left:56px}
.lp-chart svg{width:100%;height:100%;display:block}
.lp-grid line{stroke:var(--line);stroke-dasharray:4 6}
.lp-lost rect{fill:var(--bad);opacity:.18}
.lp-plot{position:relative;width:100%;height:100%}
.lp-area{fill:url(#lpg);stroke:none}
.lp-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lp-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);transition:left .35s var(--out),top .35s var(--out)}
.lp-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ping 1.2s var(--out) infinite}
.lp-lost rect{stroke:none}.lp-grid line{fill:none}
.lp-y{position:absolute;left:12px;top:8px;bottom:8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lp-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--ink-3)}

/* ───────────── extra motion ───────────── */
.btn.primary{overflow:hidden;isolation:isolate}
.btn.primary::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--out)}
.btn.primary:hover::before{transform:translateX(120%)}
:root[data-theme="dark"] .btn.primary::before{background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%)}
.row.flash .switch[aria-checked="true"]{animation:switchGlow 1.1s var(--out)}
@keyframes switchGlow{0%{box-shadow:0 0 0 0 var(--accent-soft)}40%{box-shadow:0 0 0 9px var(--accent-soft)}100%{box-shadow:0 0 0 14px transparent}}
.nav-item.active svg{animation:navPop .6s var(--out)}
@keyframes navPop{40%{transform:scale(1.22) rotate(-6deg)}}
.panel.spot{transition:transform .6s var(--out),box-shadow .6s var(--out),background-color .5s var(--soft)}
.cu-row:hover{background:var(--bg-2)}
.cu-row{transition:background-color .3s}

/* ───────────── licence (free vs key) ───────────── */
.lic-chip{display:flex;align-items:center;gap:8px;width:100%;border:0;border-radius:12px;padding:9px 12px;font:inherit;font-size:13px;font-weight:700;margin-bottom:8px;cursor:default}
.lic-chip svg{width:16px;height:16px;flex:none}
.lic-chip.on{background:rgba(46,138,87,.12);color:var(--ok)}
.lic-chip.buy{background:var(--ink);color:var(--bg);cursor:pointer;box-shadow:0 8px 20px -10px rgba(20,21,24,.5);transition:transform .4s var(--out)}
.lic-chip.buy:hover{transform:translateY(-2px)}
.prolock{width:46px;height:26px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;color:var(--ink3);display:grid;place-items:center;cursor:pointer;flex:none;margin-top:1px;transition:border-color .3s,color .3s}
.prolock svg{width:14px;height:14px}
.prolock:hover{border-color:var(--accent);color:var(--accent)}
.row.locked .title{color:var(--ink-2)}
.pro-tag{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}
.pro-tag svg{width:12px;height:12px}
.up-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.up-col{border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.up-col.pro{border-color:var(--accent);background:var(--accent-soft)}
.up-col h4{font-size:14px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.up-col h4 svg{width:15px;height:15px;color:var(--accent)}
.up-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.up-col li{display:flex;align-items:flex-start;gap:8px;font-size:13px;font-weight:600;line-height:1.35}
.up-col li svg{width:15px;height:15px;flex:none;margin-top:1px}
.key-in{display:block}
.key-in span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.key-in input{width:100%;height:46px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--card-2);color:var(--ink);font:inherit;font-size:16px;font-weight:700;letter-spacing:.08em;text-align:center;font-family:ui-monospace,Consolas,monospace;text-transform:uppercase}
.key-in input:focus{outline:none;border-color:var(--accent)}
.key-err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin-top:8px;text-align:center}
.prof-locked{opacity:.75}
.prof-lock{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--accent);margin-left:8px}
.prof-lock svg{width:12px;height:12px}

/* ───────────── in-app updater ───────────── */
.upd-prog{margin-top:20px}
.upd-bar{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.upd-bar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent) 70%,#FFB37A);transition:width .25s var(--out)}
.upd-prog-txt{margin-top:10px;font-size:13px;color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.key-problem{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:600;color:var(--warn)}
.key-problem svg{width:16px;height:16px;flex:none}
.lic-chip.trial{background:var(--accent-soft);color:var(--accent);cursor:pointer}

</style>
</head>

const easeOut = t => 1 - Math.pow(1 - t, 4);
const easeInOut = t => t < .5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;

function tween(dur, fn, done, ease = easeOut) {
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    fn(ease(t));
    if (t < 1) requestAnimationFrame(step); else if (done) done();
  };
  requestAnimationFrame(step);
}
function countUp(el, to, dur = 1600, delay = 0) {
  if (!motionOK()) { el.textContent = to; return; }
  setTimeout(() => tween(dur, k => { el.textContent = Math.round(to * k); }), delay);
}

// topographic contour lines over the landscape, drawn once per size
function drawContours() {
  const svg = $('#contours'), hero = $('#hero');
  if (!svg || !hero) return;
  const W = hero.clientWidth, H = hero.clientHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let rnd = 7; const r = () => (rnd = (rnd * 16807) % 2147483647) / 2147483647;
  const centres = [[W * 0.78, H * 0.34, 1], [W * 0.18, H * 0.9, 0.8], [W * 0.98, H * 0.95, 0.7]];
  let d = '';
  for (const [cx, cy, sc] of centres) {
    const ph = [r() * 6.28, r() * 6.28, r() * 6.28];
    for (let ring = 1; ring <= 9; ring++) {
      const R = ring * 46 * sc;
      let p = '';
      for (let a = 0; a <= 64; a++) {
        const t = a / 64 * Math.PI * 2;
        const k = 1 + 0.16 * Math.sin(3 * t + ph[0] + ring * 0.3) + 0.08 * Math.sin(5 * t + ph[1]) + 0.05 * Math.sin(7 * t + ph[2] - ring * 0.2);
        const x = cx + Math.cos(t) * R * k * 1.35, y = cy + Math.sin(t) * R * k * 0.8;
        p += (a ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      d += p + 'Z';
    }
  }
  svg.innerHTML = `<path d="${d}"/>`;
}

// the glider's flight path across the hero; progress = how optimised the PC is
function flightGeo() {
  const hero = $('#hero');
  if (!hero) return null;
  const W = hero.clientWidth, H = hero.clientHeight;
  const x0 = W * 0.43, y0 = H * 1.02, x1 = W * 0.955, y1 = H * 0.15;
  return { W, H, d: `M ${x0} ${y0} C ${W * 0.62} ${H * 0.96}, ${W * 0.72} ${H * 0.34}, ${x1} ${y1}` };
}
function setupFlight() {
  const svg = $('#flight'), G = flightGeo();
  if (!svg || !G) return null;
  svg.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);
  svg.innerHTML = `<path class="route" d="${G.d}"/><path class="done" id="flightDone" d="${G.d}"/><circle class="goal" r="5"/>`;
  const path = $('#flightDone'), len = path.getTotalLength();
  const end = path.getPointAtLength(len);
  const goal = svg.querySelector('.goal');
  goal.setAttribute('cx', end.x); goal.setAttribute('cy', end.y);
  path.style.strokeDasharray = `${len} ${len}`;
  return { path, len };
}
function placeGliderAt(F, frac) {
  const gl = $('#glider');
  if (!F || !gl) return;
  const L = Math.max(0.001, Math.min(1, frac)) * F.len;
  const p = F.path.getPointAtLength(L), q = F.path.getPointAtLength(Math.min(F.len, L + 2));
  const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
  gl.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${ang}deg)`;
  F.path.style.strokeDashoffset = String(F.len - L);
}

function afterDashboard(animate) {
  const hero = $('#hero');
  if (!hero) return;
  if (!animate && S.heroDone) hero.classList.add('still');
  drawContours();
  const F = setupFlight();
  const { frac, pct } = dashNumbers();
  if (!S.splashGone) { placeGliderAt(F, 0); return; }
  requestAnimationFrame(() => hero.classList.add('play'));
  if (!S.heroDone && motionOK()) {
    S.heroDone = true;
    placeGliderAt(F, 0.001);
    setTimeout(() => tween(2800, k => placeGliderAt(F, frac * k), null, easeInOut), 500);
    const p = $('#pctNum');
    if (p) { p.textContent = pct; p.style.minWidth = p.getBoundingClientRect().width + 'px'; p.textContent = '0'; countUp(p, pct, 2800, 500); }
    $$('[data-count]', hero).forEach((el, i) => countUp(el, +el.dataset.count, 1800, 900 + i * 140));
  } else {
    S.heroDone = true;
    const from = S.lastFrac != null ? Math.min(S.lastFrac, frac) : frac;
    if (Math.abs(from - frac) > 0.005 && motionOK()) tween(1500, k => placeGliderAt(F, from + (frac - from) * k), null, easeInOut);
    else placeGliderAt(F, frac);
  }
  S.lastFrac = frac;
}

// pointer: spotlight on cards, depth and parallax in the hero
let parX = 0, parY = 0, parTX = 0, parTY = 0, parRAF = 0;
function parallaxLoop() {
  parX += (parTX - parX) * 0.06; parY += (parTY - parY) * 0.06;
  const land = $('#heroLand'), depth = $('#depth'), cont = $('#contours');
  if (land) land.style.transform = `translate3d(${parX * -14}px, ${parY * -8}px, 0) scale(1.04)`;
  if (cont) cont.style.transform = `translate3d(${parX * -24}px, ${parY * -14}px, 0)`;
  if (depth) depth.style.transform = `rotateY(${parX * 9}deg) rotateX(${parY * -7}deg)`;
  if (Math.abs(parTX - parX) > 0.001 || Math.abs(parTY - parY) > 0.001) parRAF = requestAnimationFrame(parallaxLoop);
  else parRAF = 0;
}
document.addEventListener('pointermove', e => {
  const sp = e.target.closest && e.target.closest('.spot');
  if (sp) { const r = sp.getBoundingClientRect(); sp.style.setProperty('--mx', (e.clientX - r.left) + 'px'); sp.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
  if (!motionOK()) return;
  const hero = e.target.closest && e.target.closest('#hero');
  if (hero) {
    const r = hero.getBoundingClientRect();
    parTX = (e.clientX - r.left) / r.width - 0.5; parTY = (e.clientY - r.top) / r.height - 0.5;
  } else { parTX = 0; parTY = 0; }
  if (!parRAF) parRAF = requestAnimationFrame(parallaxLoop);
}, { passive: true });

// cards and groups tilt up into place as they scroll into view
let revealIO = null;
function setupReveal(animate) {
  const view = $('#view');
  if (revealIO) revealIO.disconnect();
  const els = $$('#view .panel:not(.hero-panel), #view .group, #view .toolbar, #view .empty, #view .rows.single > .row, #view > .grid > *');
  if (!motionOK() || !animate) { els.forEach(el => el.classList.add('rv', 'in')); return; }
  let batch = 0, batchT = 0;
  revealIO = new IntersectionObserver(entries => {
    const now = performance.now();
    if (now - batchT > 120) batch = 0;
    batchT = now;
    entries.filter(en => en.isIntersecting).forEach(en => {
      en.target.style.setProperty('--rd', (batch++ * 70) + 'ms');
      en.target.classList.add('in');
      revealIO.unobserve(en.target);
    });
  }, { root: view, threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
  els.forEach((el, i) => {
    if (el.classList.contains('in')) return;
    el.classList.add('rv', i % 2 ? 'rv-r' : 'rv-l');
    revealIO.observe(el);
  });
}

const PING_REGIONS = [['oce', 'Oceania'], ['asia', 'Asia'], ['me', 'Middle East'], ['eu', 'Europe'], ['nae', 'NA East'], ['nac', 'NA Central'], ['naw', 'NA West'], ['br', 'Brazil']];
function livePingPanel() {

function drawLivePing(full) {
  const box = $('#lpChart'), stats = $('#lpStats');
  if (!box) return;
  const L = S.livePing, xs = L.samples, N = 60;
  const good = xs.filter(x => x != null);
  const avg = good.length ? good.reduce((a, b) => a + b, 0) / good.length : 0;
  let jit = 0; for (let i = 1; i < good.length; i++) jit += Math.abs(good[i] - good[i - 1]); jit = good.length > 1 ? jit / (good.length - 1) : 0;
  const loss = xs.length ? Math.round((xs.length - good.length) / xs.length * 100) : 0;
  const last = xs.length ? xs[xs.length - 1] : null;
  stats.innerHTML = [['Now', last == null ? '–' : Math.round(last) + ' ms', true], ['Average', good.length ? Math.round(avg) + ' ms' : '–'], ['Best', good.length ? Math.round(Math.min(...good)) + ' ms' : '–'], ['Jitter', good.length > 1 ? jit.toFixed(1) + ' ms' : '–'], ['Loss', xs.length ? loss + '%' : '–']]
    .map(([l, v, big]) => `<div${big ? ' class="big"' : ''}><span>${l}</span><b>${v}</b></div>`).join('');
  const W = 1000, H = 180, pad = 10;
  const max = Math.max(40, ...good) * 1.25;
  const X = i => (i + (N - xs.length)) / (N - 1) * W;
  const Y = v => H - pad - v / max * (H - pad * 2);
  let d = '', area = '', started = false, firstX = 0;
  xs.forEach((v, i) => { if (v == null) { started = false; return; } const p = `${X(i).toFixed(1)},${Y(v).toFixed(1)}`; if (!started) { d += 'M' + p; if (!area) { firstX = X(i); area = 'M' + p; } else area += 'L' + p; started = true; } else { d += 'L' + p; area += 'L' + p; } });
  if (area) area += `L${X(xs.length - 1).toFixed(1)},${H}L${firstX.toFixed(1)},${H}Z`;
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(H * f).toFixed(0)}" y2="${(H * f).toFixed(0)}"/>`).join('');
  const lost = xs.map((v, i) => v == null ? `<rect x="${(X(i) - 3).toFixed(1)}" y="0" width="6" height="${H}"/>` : '').join('');
  const tip = last != null ? `<i class="lp-dot" style="left:${(X(xs.length - 1) / W * 100).toFixed(2)}%;top:${(Y(last) / H * 100).toFixed(2)}%"></i>` : '';
  box.innerHTML = `<div class="lp-plot"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="lpg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    <g class="lp-grid">${grid}</g><g class="lp-lost">${lost}</g>${area ? `<path class="lp-area" d="${area}"/>` : ''}${d ? `<path class="lp-line" d="${d}" vector-effect="non-scaling-stroke"/>` : ''}</svg>${tip}</div>
    <div class="lp-y"><span>${Math.round(max)} ms</span><span>${Math.round(max / 2)} ms</span><span>0</span></div>
    ${xs.length ? '' : `<div class="lp-empty">Press Start to watch your ping live</div>`}`;
}
async function livePingLoop() {
  const L = S.livePing;
  while (L.running) {
    const t0 = performance.now();
    let v = null;
    try { const r = await api('pingOnce', { id: L.region }); v = r && !r.error && r.loss < 100 ? r.avg : null; } catch (e) { v = null; }

let updating = false;
on('updateProgress', p => {
  const box = $('#updProg'), fill = $('#updBarFill'), txt = $('#updProgTxt');
  if (!box) return;
  box.hidden = false;
  const pct = Math.max(0, Math.min(100, p.pct || 0));
  if (fill) fill.style.width = pct + '%';
  if (txt) txt.textContent = p.done ? 'Finishing…' : (p.totalMB > 0 ? `Downloading… ${pct}% (${(p.receivedMB||0).toFixed(1)} of ${p.totalMB.toFixed(1)} MB)` : `Downloading… ${(p.receivedMB||0).toFixed(1)} MB`);
});
async function runUpdate() {
  if (updating) return; updating = true;
  const foot = $('#updFoot'), prog = $('#updProg');
  const m = $('#modal'); if (m) m.dataset.locked = '1';
  if (foot) foot.innerHTML = `<span class="muted small">Keep AstroSpeed open while it updates…</span>`;
  if (prog) prog.hidden = false;
  try {
    await api('downloadUpdate');
    const txt = $('#updProgTxt'); if (txt) txt.textContent = 'Installing and restarting…';
    await api('applyUpdate');          // app relaunches itself; this window closes
  } catch (e) {
    updating = false;
    if (m) delete m.dataset.locked;
    if (prog) prog.hidden = true;
    if (foot) foot.innerHTML = `<button class="btn quiet" data-act="skipUpdate" type="button">Skip this version</button><span class="spacer"></span><button class="btn ghost" data-close type="button">Later</button><button class="btn primary" data-act="installUpdate" type="button">Try again</button>`;
    toast(e.message || 'Update failed.', 'err', 8000);
  }
}
async function autoCheckUpdate() {
  if (!S.data.updateConfigured || !S.data.autoUpdate) return;
  try {
    S.update = await api('checkUpdate');
    if (!S.update.available) return;
    if (S.data.afterUpdate) { renderNav(); toast(`The update finished, but the server still offers ${S.update.latest}. Re-upload the right .exe in your admin page.`, 'err', 10000); return; }
    renderNav();
    let skipped = '';
    try { skipped = localStorage.getItem('sg-skip-version') || ''; } catch (e) { /* ignore */ }
    if (skipped !== S.update.latest) setTimeout(() => { if ($('#modal').hidden) showUpdate(); }, 1800);
  } catch (e) { /* offline: try again next launch */ }
}

function driverAgeDays(g) {
  const m = /^(\d{1,2})-(\d{1,2})-(\d{4})$/.exec((g && g.driverDate) || '');

function liveHTML() {

    <div class="lv"><span class="lv-l">CPU</span><span class="lv-v" id="lvCpu">–</span><svg class="spark" id="spCpu" viewBox="0 0 120 34" preserveAspectRatio="none"></svg></div>

    <div class="lv"><span class="lv-l">Now playing</span><span class="lv-v lv-game" id="lvGame">–</span><span class="lv-s" id="lvProcs"></span></div>
  </div></div>`;

function sparkPath(arr) {
  if (arr.length < 2) return '';
  const n = 40, pts = arr.slice(-n), w = 120, h = 34;
  const step = w / (n - 1), off = (n - pts.length) * step;
  const line = pts.map((v, i) => `${(off + i * step).toFixed(1)},${(h - 2 - (Math.max(0, Math.min(100, v)) / 100) * (h - 4)).toFixed(1)}`).join(' ');
  return `<polyline class="area" points="${off.toFixed(1)},${h} ${line} ${w},${h}"/><polyline class="ln" points="${line}"/>`;
}
async function liveTick() {
  if (S.page !== 'dashboard' || !$('#lvCpu')) { stopLive(); return; }
  try {
    const l = await api('live');
    if (l.cpu >= 0) { if (!S.hist.cpu.length) S.hist.cpu = Array(40).fill(l.cpu); S.hist.cpu.push(l.cpu); }
    if (!S.hist.ram.length) S.hist.ram = Array(40).fill(l.ramPct);
    S.hist.ram.push(l.ramPct);
    S.hist.cpu = S.hist.cpu.slice(-60); S.hist.ram = S.hist.ram.slice(-60);
    const set = (id, v) => { const el = $('#' + id); if (el && el.innerHTML !== v) el.innerHTML = v; };
    set('lvCpu', l.cpu >= 0 ? `${Math.round(l.cpu)}<small>%</small>` : '…');
    set('lvRam', `${Math.round(l.ramPct)}<small>%</small>`);
    set('lvTimer', l.timer ? l.timer.toFixed(2) : '–');
    set('lvGame', l.game ? esc(l.game) : '<span class="dim">Nothing</span>');
    set('lvProcs', `${l.procs} processes running · ${l.ramUsedGB.toFixed(1)} of ${Math.round(l.ramGB)} GB used`);
    const a = $('#spCpu'), b = $('#spRam');
    if (a) a.innerHTML = sparkPath(S.hist.cpu);
    if (b) b.innerHTML = sparkPath(S.hist.ram);
  } catch (e) { /* the monitor is optional */ }
}
function startLive() { stopLive(); liveTick(); liveTimer = setInterval(liveTick, 1000); }
function stopLive() { clearInterval(liveTimer); liveTimer = 0; }

function groupsHTML(list, single) {
  const groups = [];
  list.forEach(t => {
    let g = groups.find(x => x.name === t.group);

  return groups.map(g => `
    <div class="group">
      <div class="group-h"><h3>${esc(g.name)}</h3><span>${appliedCount(g.items)} of ${availCount(g.items)} on</span></div>
      <div class="rows${single || g.items.length === 1 ? ' single' : ''}">${g.items.map(rowHTML).join('')}</div>
    </div>`).join('');
}

// ───────────────────────── toasts & modal ─────────────────────────
function toast(msg, kind = 'info', ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = ico(kind === 'ok' ? 'ok' : kind === 'err' ? 'warn' : 'info') + `<span>${esc(msg)}</span>`;
  el.style.setProperty('--life', ms + 'ms');
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('leave'); setTimeout(() => el.remove(), 380); }, ms);
}
let modalToken = 0;
function openModal(html, narrow) {
  const m = $('#modal');
  const tok = ++modalToken;
  const already = !m.hidden && m.classList.contains('show');
  m.innerHTML = `<div class="dialog${narrow ? ' narrow' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.hidden = false;
  if (!already) { m.classList.remove('show'); void m.offsetWidth; }
  requestAnimationFrame(() => { if (tok === modalToken) m.classList.add('show'); });
  const f = m.querySelector('[data-autofocus]') || m.querySelector('button');
  if (f) f.focus({ preventScroll: true });
}
function closeModal() {
  const m = $('#modal');
  if (m.dataset.locked || m.hidden) return;
  const tok = ++modalToken;
  m.classList.remove('show');
  setTimeout(() => { if (tok === modalToken) { m.hidden = true; m.innerHTML = ''; } }, 320);
}
function confirmBox(title, body, okLabel, danger) {
  return new Promise(res => {
    openModal(`<div class="dialog-h"><div><h2>${esc(title)}</h2><p>${body}</p></div></div>
      <div class="dialog-f"><span class="spacer"></span><button class="btn ghost" data-c="0" type="button">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-c="1" data-autofocus type="button">${esc(okLabel)}</button></div>`, true);
    $('#modal').onclick = e => {
      const b = e.target.closest('[data-c]');
      if (b) { $('#modal').onclick = null; closeModal(); res(b.dataset.c === '1'); }
      else if (e.target.id === 'modal') { $('#modal').onclick = null; closeModal(); res(false); }
    };
  });
}

      <p class="dim small" style="margin:10px 0 0">Manual-only tweaks (security trade-offs and appearance) are never included. Your sensitivity and game settings are never touched.</p>
    </div>
    <div class="dialog-f"><span class="muted small" id="optSummary"></span><span class="spacer"></span><button class="btn ghost" data-close type="button">Cancel</button><button class="btn primary lg" data-act="startOptimize" data-autofocus type="button">${ico('glider')}Start optimizing</button></div>`);
  updateOptSummary();
}
function updateOptSummary() {
  const n = pendingFor(profileChoice).length;
  const s = $('#optSummary');
  const lk = lockedFor(2).length;
  if (s) s.textContent = (n ? `${plural(n, 'tweak')} will be applied.` : 'Everything you can apply here is already on.') + (lk ? ` ${lk} more need a key.` : '');
  $$('.profile').forEach(b => b.classList.toggle('on', +b.dataset.profile === profileChoice));
}

function runJob(kind, args, title, intro) {
  const m = $('#modal');
  m.dataset.locked = '1';
  openModal(`
    <div class="dialog-h"><div><h2>${esc(title)}</h2><p id="jobNow">${esc(intro)}</p></div></div>
    <div class="dialog-b"><div class="progress"><i id="jobBar"></i></div><div class="flight" id="flight"></div></div>
    <div class="dialog-f" id="jobFoot"><span class="muted small">Keep AstroSpeed open until this finishes.</span></div>`);
  const flight = $('#flight');
  const icon = s => s === 'ok' || s === 'reverted' ? ico('ok', 'ico-ok') : s === 'already' ? ico('ok', 'ico-na') : s === 'partial' ? ico('warn', 'ico-warn') : s === 'failed' ? ico('bad', 'ico-bad') : s === 'locked' ? ico('lock', 'ico-warn') : ico('dash', 'ico-na');
  const word = { ok: 'Applied', reverted: 'Undone', already: 'Already set', skipped: 'Not on this PC', partial: 'Partly applied', failed: 'Failed', nothing: 'Nothing to undo', locked: 'Needs a key' };
  const off = on('progress', p => {
    if (p.phase === 'restore') { $('#jobNow').textContent = p.title + '…'; flight.insertAdjacentHTML('beforeend', `<div class="fl" id="flRestore"><div class="spin"></div><div>${esc(p.title)}</div><div class="m">This can take a minute</div></div>`); }
    if (p.phase === 'restore-ok' || p.phase === 'restore-failed') {
      const r = $('#flRestore'); if (r) r.outerHTML = `<div class="fl">${p.phase === 'restore-ok' ? ico('ok', 'ico-ok') : ico('warn', 'ico-warn')}<div>${esc(p.title)}</div><div class="m">${esc(p.msg || '')}</div></div>`;
    }
    if (p.phase === 'start') {
      $('#jobNow').textContent = p.title;
      flight.insertAdjacentHTML('beforeend', `<div class="fl" data-fl="${p.id}"><div class="spin"></div><div>${esc(p.title)}</div><div class="m"></div></div>`);
      flight.scrollTop = flight.scrollHeight;
    }
    if (p.phase === 'done') {
      const row = flight.querySelector(`[data-fl="${p.id}"]`);
      if (row) {
        row.firstElementChild.outerHTML = icon(p.status);
        row.lastElementChild.textContent = (word[p.status] || p.status) + (p.msg && p.status !== 'already' && p.status !== 'skipped' ? ' · ' + p.msg : (p.status === 'skipped' && p.msg ? ' · ' + p.msg : ''));
        if (p.status === 'failed' || p.status === 'partial') row.lastElementChild.title = p.msg || '';
      }
      $('#jobBar').style.width = (p.n ? p.i / p.n * 100 : 100) + '%';
    }
  });
  return api(kind, args).then(res => {
    off();
    S.bcdReady = true;
    delete m.dataset.locked;
    const r = res.results || [];
    const good = r.filter(x => x.status === 'ok' || x.status === 'reverted').length;
    const bad = r.filter(x => x.status === 'failed' || x.status === 'partial').length;
    const skip = r.filter(x => x.status === 'skipped' || x.status === 'already' || x.status === 'nothing').length;
    $('#jobBar').style.width = '100%';
    $('.progress').classList.add('done');
    $('#jobNow').textContent = kind === 'apply' ? 'Done. Every change is backed up and can be undone.' : 'Undone. Original values are back.';
    flight.insertAdjacentHTML('beforebegin', `<div class="result-head"><svg class="done-ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30"/><path d="m20 33 8 8 16-17"/></svg>
      <div class="result-stats"><div><div class="v" data-count="${good}">0</div><div class="l">${kind === 'apply' ? 'tweaks applied' : 'tweaks undone'}</div></div><div><div class="v" data-count="${res.changes || 0}">0</div><div class="l">individual changes</div></div><div><div class="v" data-count="${skip}">0</div><div class="l">already set or not on this PC</div></div>${bad ? `<div><div class="v" style="color:var(--flare)" data-count="${bad}">0</div><div class="l">need attention</div></div>` : ''}</div></div>`);
    $$('.result-stats [data-count]').forEach((el, i) => countUp(el, +el.dataset.count, 1200, 200 + i * 120));
    S.reboot = !!res.reboot;
    $('#jobFoot').innerHTML = `<span class="muted small">${res.reboot ? 'Some changes take effect after a restart.' : 'All changes are live.'}</span><span class="spacer"></span>
      ${res.reboot ? `<button class="btn ghost" data-act="restart" type="button">${ico('reboot')}Restart now</button>` : ''}<button class="btn primary" data-close data-autofocus type="button">Done</button>`;
    return refreshStates();
  }).catch(e => {
    off();
    delete m.dataset.locked;
    $('#jobNow').textContent = e.message;
    $('#jobFoot').innerHTML = `<span class="spacer"></span><button class="btn primary" data-close type="button">Close</button>`;
  });
}

async function refreshStates() {
  try {
    const r = await api('states', { bcd: !!S.bcdReady });
    S.states = r.states || {};
    S.reboot = !!r.reboot;
  } catch (e) { toast(e.message, 'err'); }
  try {
    const d = await api('init');
    S.data.totalChanges = d.totalChanges; S.data.lastOptimize = d.lastOptimize; S.data.restorePoints = d.restorePoints; S.data.profile = d.profile; S.data.env = d.env;
  } catch (e) { /* keep old */ }
  rerenderView();
}

async function undoAll() {
  const n = T().filter(t => st(t.id) === 'on' || st(t.id) === 'reset').length;
  if (!n) { toast('AstroSpeed has nothing applied right now.', 'info'); return; }
  if (await confirmBox('Undo everything?', `This puts back the original value of every setting AstroSpeed changed (${plural(n, 'tweak')}), newest first. Restart afterwards to finish.`, 'Undo everything', true)) runJob('revertAll', {}, 'Undoing all changes', 'Starting…');
}

async function toggleTweak(id) {
  const t = byId(id), s = st(id);
  if (locked(t)) { showUpgrade(); return; }
  if (s === 'native') { toast('Windows already had this set before AstroSpeed, so there is nothing to undo.', 'info'); return; }
  const turningOn = !(s === 'on');
  if (turningOn && t.risk === 'expert') {
    const ok = await confirmBox(t.title, esc(t.note || 'This is an expert tweak.') + '<br><br>You can undo it at any time.', 'Apply anyway', true);
    if (!ok) return;
  }
  S.busy.add(id); rerenderView();
  try {
    const res = await api(turningOn ? 'apply' : 'revert', { ids: [id] });
    const r = (res.results || [])[0] || {};
    if (r.status === 'failed') toast(`${t.title}: ${r.msg}`, 'err', 7000);
    else if (r.status === 'partial') toast(`${t.title}: partly applied. ${r.msg}`, 'err', 7000);
    else if (r.status === 'skipped') toast(`${t.title}: ${r.msg || 'not on this PC'}`, 'info');
    else if (r.status === 'already') toast(`${t.title} was already set on this PC.`, 'info');
    else toast((turningOn ? 'Applied: ' : 'Undone: ') + t.title + (t.reboot && r.changes ? ' (restart to finish)' : ''), 'ok');
  } catch (e) { toast(e.message, 'err'); }
  S.busy.delete(id);
  S.flash = { id, on: turningOn };
  await refreshStates();
}

    case 'changes': S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); rerenderView(); break;

      api('setProfile', { profile: profileChoice }).catch(() => {});

    case 'applyCat': {

    case 'bios': if (await confirmBox('Restart into BIOS?', 'Your PC will restart straight into its BIOS/UEFI setup in 5 seconds. Save anything you have open. To leave without changes, choose <b>Exit without saving</b>.', 'Restart into BIOS')) api('restart', { firmware: true }).catch(err => toast(err.message, 'err', 8000)); break;

    case 'timer': try { await api('boostTimer', { on: !(S.booster && S.booster.timerHeld) }); S.booster = await api('boostStatus'); } catch (err) { toast(err.message, 'err'); } rerenderView(); break;
    case 'purge': try { const mb = await api('boostPurge'); toast(`Standby memory cleared. ${fmtMB(Math.max(0, mb))} more is free.`, 'ok'); S.booster = await api('boostStatus'); } catch (err) { toast(err.message, 'err'); } rerenderView(); break;
    case 'prio': try { const r = await api('boostPriority'); toast(r.running ? 'Your game is now running at high priority.' : 'No supported game is running.', r.running ? 'ok' : 'info'); } catch (err) { toast(err.message, 'err'); } break;

    case 'applyGames': { const ids = gamePending().map(t => t.id); if (ids.length) runJob('apply', { ids }, 'Applying game tweaks', 'Starting…'); break; }
    case 'bgrefresh': S.bgApps = null; S.bgSel = null; S.booster = null; rerenderView(); break;
    case 'bgclose': {
      const names = [...S.bgSel];
      if (!names.length) { toast('Tick the apps you want to close first.', 'info'); return; }
      try { const r = await api('bgClose', { names }); toast(`Closed ${plural(r.closed, 'process', 'processes')}, about ${fmtMB(r.freedMB)} freed.`, 'ok'); } catch (err) { toast(err.message, 'err'); }
      S.bgApps = null; S.bgSel = null; rerenderView(); break;
    }

      b.disabled = true;

      try { await api('flushDNS'); out.push('DNS flushed'); } catch (err) { /* ignore */ }
      try { const r = await api('boostPriority'); if (r.running) out.push('game at high priority'); } catch (err) { /* ignore */ }
      if (S.bgSel && S.bgSel.size) { try { const r = await api('bgClose', { names: [...S.bgSel] }); if (r.closed) out.push(plural(r.closed, 'app process', 'app processes') + ' closed'); } catch (err) { /* ignore */ } }
      toast('Boosted: ' + (out.join(', ') || 'nothing to do') + '.', 'ok', 6000);
      S.booster = null; S.bgApps = null; S.bgSel = null; rerenderView(); break;
    }
    case 'scan': S.clean = null; rerenderView(); break;
    case 'clean': {
      const ids = [...S.cleanSel];

      const item = S.startup.find(i => i.id === id);

      rerenderView(); break;
    }
    case 'rescan': runScan(); break;
    case 'fixAll': { const ids = [...new Set(checkupItems().filter(i => !i.ok && i.tweak).map(i => i.tweak))].filter(id => byId(id) && st(id) !== 'na'); if (ids.length) { await runJob('apply', { ids }, 'Fixing checkup issues', 'Starting…'); try { S.checkup = await api('checkup'); } catch (err) { /* keep */ } if (S.page === 'checkup') rerenderView(); } break; }

    case 'ping': S.pinging = true; rerenderView(); try { S.ping = await api('ping'); } catch (err) { toast(err.message, 'err'); } S.pinging = false; rerenderView(); break;
    case 'flushdns': try { await api('flushDNS'); toast('DNS cache flushed.', 'ok'); } catch (err) { toast(err.message, 'err'); } break;
    case 'logrefresh': S.log = null; rerenderView(); break;
  }
});

}

on('autoboost', d => toast(`${d.game} started. Boosted: memory cleared, timer tightened, high priority.`, 'ok', 6000));
$('#themeBtn').addEventListener('click', () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
$('#motionBtn').addEventListener('click', () => { applyMotion(document.documentElement.classList.contains('motion-off'), true); if (S.data) rerenderView(); });

(async function boot() {
  const t0 = performance.now();
  loadPrefs();
  // the native bridge is injected by WebView2; give it a moment on slow machines
  for (let i = 0; i < 100 && !(window.sgInvoke || window.__sgMock); i++) await new Promise(r => setTimeout(r, 50));
  try {
    S.data = await api('init');
    const r = await api('states', { bcd: false });
    S.states = r.states || {}; S.reboot = !!r.reboot;
    try { S.data.env.games = await api('games'); } catch (e) { /* optional */ }
    render();
    api('gameIcons').then(ic => { S.icons = ic || {}; if (S.page === 'games' || S.page === 'dashboard' || isGameCat(S.page)) rerenderView(); }).catch(() => {});
    api('ready').catch(() => {});
  } catch (e) {
    $('#view').innerHTML = `<div class="empty"><h3>AstroSpeed couldn't start</h3><p>${esc(e.message)}</p></div>`;
  }
  const wait = motionOK() ? Math.max(0, 1900 - (performance.now() - t0)) : 0;
  setTimeout(() => {
    $('#splash').classList.add('out');
    $('#app').classList.add('ready');
    S.splashGone = true;
    if (S.data) { S.anim = true; render(); }
    if (S.data) { api('drives').then(d => { S.drives = d || []; if (S.page === 'dashboard') rerenderView(); }).catch(() => {}); setTimeout(autoCheckUpdate, 1200); if (LIC().needsRevert) setTimeout(enforceTrialEnd, 900); }
    setTimeout(() => $('#splash').remove(), 1400);
  }, wait);
})();
})();

</script>
</body>
</html>
