<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · AstroSpeed</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0B0C;color:#F3F1EC;font-family:"Segoe UI",system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.card{max-width:480px;width:100%;background:#17171A;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:32px 28px;text-align:center}
h1{font-size:24px;letter-spacing:-.02em;margin-bottom:10px}
p{color:#A6A8AE;line-height:1.55}
a.btn{display:inline-flex;margin-top:22px;height:46px;align-items:center;padding:0 22px;border-radius:999px;background:linear-gradient(120deg,#FF3D6E,#FF6B3F 55%,#FFB27A);color:#1b0a04;font-weight:800;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>{{TITLE}}</h1>
  {{BODY}}
  <a class="btn" href="{{ORIGIN}}/">Back to the website</a>
</div>
</body>
</html>
